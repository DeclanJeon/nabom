# NABOM production nginx site — https://nabom.ponslink.com
# 배포: 서버 /etc/nginx/sites-enabled/nabom.ponslink.com
#
# 캐시 정책:
# - HTML은 no-store. Next가 정적 페이지에 붙이는 s-maxage=31536000 때문에
#   Cloudflare가 HTML을 1년간 캐싱해, 재배포 후에도 옛 번들을 서빙하는
#   문제가 있었다 (2026-08-19 확인·수정).
# - _next/static은 해시 파일명이므로 1년 immutable 캐시.
server {
    listen 80;
    listen [::]:80;
    server_name nabom.ponslink.com;
    return 301 https://nabom.ponslink.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nabom.ponslink.com;
    ssl_certificate /etc/ssl/ponslink/ponslink.crt;
    ssl_certificate_key /etc/ssl/ponslink/ponslink.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    client_max_body_size 20m;
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    location /healthz {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:3088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, max-age=0" always;
    }
}
